name: 接口源分享
description: 分享你写的 .jdr 接口源——拖进来就行
title: "[接口源] "
labels: [ "source-share" ]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享接口源！只需记住一条边界：**只分享 `.jdr` 包或它的源码**，
        不要上传音频文件，也不要贴你个人的服务器地址和密钥。

        想自己写一个？看[接口源开发套件](https://github.com/cq10086123/Timbre/blob/main/samples/README.md)，
        三步就能打出 `.jdr` 包。

  - type: input
    id: source-name
    attributes:
      label: 接口名称
      placeholder: "随便填，中英文都行"
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: 接口源文件或链接
      description: 直接把 `.jdr` 文件拖进输入框即可；也可以贴直链、源码仓库或发布页链接
      placeholder: "拖入 .jdr 文件，或粘贴链接"
    validations:
      required: true

  - type: textarea
    id: about
    attributes:
      label: 简介（可选）
      description: 能搜到什么内容、有没有使用限制、需要用户配置什么——没有就不用填
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是我自己写的或有权分享的接口源，不含音频文件，也不含我个人的服务器地址和密钥
          required: true
